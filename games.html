<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEPHEN.CORE // Games</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: sans-serif; margin: 0; padding-top: 100px; }
        nav { position: fixed; top: 0; width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .logo { font-family: 'Orbitron'; color: #00f2ff; text-decoration: none; }
        .nav-links a { color: #888; text-decoration: none; font-family: 'Orbitron'; margin-left: 30px; }
        .nav-links a:hover, .nav-links a.active { color: #00f2ff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 50px; }
        .card { background: #111; border: 1px solid #222; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; text-decoration: none; color: white; transition: 0.3s; }
        .card:hover { border-color: #00f2ff; transform: translateY(-5px); }
        .card i { font-size: 3rem; color: #00f2ff; margin-bottom: 15px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Stephen.Core</a>
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="games.html" class="active">GAMES</a>
        </div>
    </nav>
    <div class="grid">
        <!-- LINKING TO THE SEPARATE GAME PAGE -->
        <a href="brotato.html" class="card">
            <i class="fas fa-gamepad"></i>
            <h3>BROTATO</h3>
            <p>Launch Session</p>
        </a>
    </div>
</body>
</html>
