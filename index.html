<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEPHEN.CORE // Gaming Interface</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
            --accent: #00f2ff;
            --text: #ffffff;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: uppercase;
        }

        .nav-links button {
            background: none;
            border: none;
            color: #888;
            font-family: 'Orbitron', sans-serif;
            margin-left: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
            letter-spacing: 1px;
        }

        .nav-links button:hover, .nav-links button.active {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
        }

        /* Content Sections */
        .page {
            display: none;
            padding: 120px 50px 50px;
            animation: fadeIn 0.8s ease forwards;
        }

        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Homepage Style */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1);
        }

        .game-thumb {
            width: 100%;
            height: 180px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--accent);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .game-info { padding: 20px; }
        .game-info h3 { font-family: 'Orbitron'; margin-bottom: 5px; font-size: 1.1rem; }
        .game-info p { font-size: 0.8rem; color: #777; }

        /* Game Overlay */
        #game-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: none;
        }

        .game-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1010;
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover { background: var(--accent); color: black; border-color: var(--accent); }

        iframe#game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Stephen.Core</div>
        <div class="nav-links">
            <button onclick="showPage('home')" id="home-btn" class="active">HOME</button>
            <button onclick="showPage('games')" id="games-btn">GAMES</button>
        </div>
    </nav>

    <!-- Homepage -->
    <section id="home" class="page active">
        <div class="hero">
            <h1>SYSTEM ARCHIVE</h1>
            <p style="color: var(--accent); letter-spacing: 5px; font-weight: bold;">CURATED BY STEPHEN</p>
            <div style="margin-top: 40px; color: #555; font-size: 0.9rem; max-width: 500px; line-height: 1.6;">
                A clean, performance-focused interface for high-end web applications. 
                Navigate to the games tab to begin your session.
            </div>
        </div>
    </section>

    <!-- Games Tab -->
    <section id="games" class="page">
        <div class="games-grid">
            <div class="game-card" onclick="launchGame()">
                <div class="game-thumb">
                    <i class="fas fa-gamepad"></i>
                </div>
                <div class="game-info">
                    <h3>BROTATO</h3>
                    <p>Survivor roguelite arena shooter.</p>
                </div>
            </div>

            <div class="game-card" style="opacity: 0.2; cursor: default;">
                <div class="game-thumb"><i class="fas fa-lock"></i></div>
                <div class="game-info"><h3>ENCRYPTED</h3><p>Next entry pending...</p></div>
            </div>
        </div>
    </section>

    <!-- Game View Overlay -->
    <div id="game-view">
        <div class="game-controls">
            <button class="control-btn" onclick="toggleFullscreen()"><i class="fas fa-expand"></i> FULLSCREEN</button>
            <button class="control-btn" onclick="closeGame()" style="background: rgba(255,50,50,0.1);"><i class="fas fa-power-off"></i> SHUTDOWN</button>
        </div>
        <div id="game-engine-container" style="width:100%; height:100%;"></div>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById(pageId + '-btn').classList.add('active');
        }

        function launchGame() {
            const container = document.getElementById('game-engine-container');
            const view = document.getElementById('game-view');
            const rawCode = document.getElementById("brotato-source").innerHTML;
            
            // Create a Blob to bypass iframe security restrictions
            const blob = new Blob([rawCode], { type: 'text/html' });
            const gameUrl = URL.createObjectURL(blob);
            
            const iframe = document.createElement('iframe');
            iframe.id = "game-frame";
            iframe.src = gameUrl;
            
            // Critical permissions for Godot/Brotato
            iframe.setAttribute('allow', 'cross-origin-isolated; autoplay; fullscreen');
            
            container.innerHTML = ''; 
            container.appendChild(iframe);
            view.style.display = 'block';
        }

        function closeGame() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-engine-container').innerHTML = '';
        }

        function toggleFullscreen() {
            const elem = document.getElementById("game-frame");
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        }
    </script>

<script>
(function() {

const BASE = "https://cdn.jsdelivr.net/gh/shayderrr/newports@" + HASH + "/";
const TOTAL_MB = "163.00"; 
const mergedData = {};
const pendingRequests = {};
let bytesLoadedSoFar = 0;
const statusEl = document.getElementById('status');

function updateStatus(currentBytes) {
    const currentMB = (currentBytes / 1048576).toFixed(2);
    statusEl.innerHTML = "LOADING DATA: " + currentMB + " / " + TOTAL_MB + " MB";
}

const originalFetch = window.fetch;
window.fetch = function(url, ...args) {
    const u = url.toString();
    if (u.includes("index.pck") || u.includes("index.wasm")) {
        const f = u.includes(".pck") ? "index.pck" : "index.wasm";
        if (mergedData[f]) return Promise.resolve(new Response(mergedData[f]));
        return new Promise((resolve) => {
            if (!pendingRequests[f]) pendingRequests[f] = [];
            pendingRequests[f].push(resolve);
        });
    }
    return originalFetch(url, ...args);
};

async function merge(name, start, end) {
    const bufs = [];
    for (let i = start; i <= end; i++) {
        const r = await originalFetch(BASE + encodeURIComponent(name + ".part" + i));
        const data = await r.arrayBuffer();
        bufs.push(data);
        bytesLoadedSoFar += data.byteLength;
        updateStatus(bytesLoadedSoFar);
    }
    const b = new Blob(bufs, { type: 'application/octet-stream' });
    mergedData[name] = b;
    if (pendingRequests[name]) {
        pendingRequests[name].forEach(res => res(new Response(b)));
        delete pendingRequests[name];
    }
}

async function init() {

        await merge("index.wasm", 1, 2);

            const engine = new Engine({"args":[],"canvasResizePolicy":2,"executable":"index","fileSizes":{"index.pck":144746880,"index.wasm":26156492},"focusCanvas":true});
            engine.startGame().then(() => {
                statusEl.style.display = 'none';
                window.dispatchEvent(new Event('resize'));
            });
        };
        document.body.appendChild(s);
